<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4F46E5"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes">
<title>MyFin</title>
<style>
:root{--bg:#F4F5FB;--card:#fff;--tx:#1B1E3A;--mut:#6B7094;--pri:#4F46E5;--pri2:#EEF0FF;--ok:#16A34A;--warn:#F59E0B;--bad:#DC2626;--line:#E4E6F2;--sh:0 4px 16px rgba(30,30,80,.07)}
[data-theme=dark]{--bg:#0F1020;--card:#1A1B30;--tx:#EEF0FF;--mut:#9A9EC4;--pri:#7C75FF;--pri2:#26274A;--line:#2C2E52;--sh:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px}
#app{max-width:480px;margin:0 auto;min-height:100vh;position:relative;padding:16px 16px 100px}
h1{font-size:26px;margin:8px 0}h2{font-size:20px;margin:6px 0}h3{font-size:16px;margin:0}
p{color:var(--mut);line-height:1.45}
.card{background:var(--card);border-radius:18px;padding:16px;margin:12px 0;box-shadow:var(--sh)}
.hero{background:linear-gradient(135deg,#4F46E5,#7C3AED);color:#fff}
.hero .big{font-size:34px;font-weight:800;margin:4px 0}.hero small{opacity:.85}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.grid3 div{background:rgba(255,255,255,.15);border-radius:12px;padding:8px;text-align:center;font-size:12px}
.grid3 b{display:block;font-size:15px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px;font-size:16px;font-weight:700;background:var(--pri);color:#fff;cursor:pointer;margin:8px 0}
.btn.sec{background:var(--pri2);color:var(--pri)}.btn.ghost{background:none;color:var(--mut);font-weight:600}
.btn.danger{background:#FEE2E2;color:var(--bad)}.btn:disabled{opacity:.4}
.btn.sm{display:inline-block;width:auto;padding:8px 12px;font-size:13px;margin:2px}
input,select{width:100%;padding:13px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--tx);font-size:16px;margin:6px 0}
label{font-size:13px;color:var(--mut);font-weight:600}
.opt{border:2px solid var(--line);border-radius:16px;padding:14px;margin:10px 0;cursor:pointer;background:var(--card)}
.opt.on{border-color:var(--pri);background:var(--pri2)}.opt b{display:block;margin-bottom:2px}.opt span{color:var(--mut);font-size:13px}
.prog{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:8px 0 4px}
.prog i{display:block;height:100%;border-radius:6px}
.g{background:var(--ok)}.y{background:var(--warn)}.r{background:var(--bad)}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cat{cursor:pointer}.cat .top{display:flex;justify-content:space-between;font-weight:700}
.sub{font-size:12px;color:var(--mut);display:flex;justify-content:space-between}
.insight{display:flex;gap:10px;align-items:center;font-weight:600}
.insight.ok{background:#DCFCE7;color:#14532D}.insight.warn{background:#FEF3C7;color:#78350F}.insight.bad{background:#FEE2E2;color:#7F1D1D}
.sum{position:sticky;top:0;z-index:5;background:var(--card);border-radius:16px;padding:12px;box-shadow:var(--sh);font-size:13px}
.sum .row{padding:2px 0}.neg{color:var(--bad);font-weight:700}.pos{color:var(--ok);font-weight:700}
.dr{display:grid;grid-template-columns:1fr 110px 70px;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.dr input{margin:0;padding:9px;text-align:right}.dr .c{text-align:right;color:var(--mut);font-size:13px}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--card);display:flex;justify-content:space-around;align-items:center;padding:8px 4px calc(8px + env(safe-area-inset-bottom));border-top:1px solid var(--line);z-index:10}
nav button{background:none;border:0;color:var(--mut);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;flex:1}
nav button span{font-size:20px}nav button.on{color:var(--pri);font-weight:700}
nav .plus{flex:0 0 58px;height:58px;border-radius:50%;background:var(--pri);color:#fff;font-size:30px;margin-top:-26px;box-shadow:0 6px 16px rgba(79,70,229,.45);justify-content:center}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.chip{padding:8px 12px;border-radius:20px;background:var(--pri2);color:var(--pri);font-size:13px;font-weight:600;cursor:pointer;border:2px solid transparent}.chip.on{border-color:var(--pri)}
.mhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.mhead button{background:var(--card);border:0;border-radius:50%;width:36px;height:36px;font-size:18px;color:var(--tx);cursor:pointer;box-shadow:var(--sh)}
.bar{height:5px;background:var(--line);border-radius:4px;margin:0 0 14px}.bar i{display:block;height:100%;background:var(--pri);border-radius:4px}
#toast{position:fixed;top:14px;left:50%;transform:translateX(-50%) translateY(-120px);background:#1B1E3A;color:#fff;padding:12px 18px;border-radius:14px;z-index:99;transition:.3s;max-width:90%;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.3)}
#toast.show{transform:translateX(-50%) translateY(0)}
.modal{position:fixed;inset:0;background:rgba(10,10,30,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal>div{background:var(--card);width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:20px 20px 28px}
.mv{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);gap:8px}
.mv .a{font-weight:700}.mv small{color:var(--mut);display:block}
.logo{font-size:44px}.center{text-align:center}.tiny{font-size:12px;color:var(--mut)}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
.mini{display:flex;gap:6px;margin-top:6px}
.seg{display:flex;background:var(--pri2);border-radius:14px;padding:4px;margin:10px 0;overflow-x:auto;gap:2px;scrollbar-width:none}
.seg button{flex:1 0 auto;white-space:nowrap;border:0;background:none;padding:9px 11px;border-radius:10px;font-weight:700;color:var(--pri);font-size:13px;cursor:pointer}
.seg button.on{background:var(--card);box-shadow:var(--sh)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}.kpi{background:var(--pri2);border-radius:14px;padding:10px}.kpi small{color:var(--mut);display:block;font-size:11px}.kpi b{font-size:17px}
.leg{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:4px 0}.leg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px}
.pv{margin:8px 0}.pv .l{display:flex;justify-content:space-between;font-size:13px;font-weight:600}.pv .b{height:7px;border-radius:5px;background:var(--line);margin:3px 0;overflow:hidden}.pv .b i{display:block;height:100%;border-radius:5px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center;font-size:10px}
.cal .h{color:var(--mut);font-weight:700;padding:2px 0}.cal .d{border-radius:8px;padding:5px 0;min-height:38px;cursor:pointer;border:1.5px solid transparent;color:var(--tx)}.cal .d b{display:block;font-size:11px}.cal .d.sel{border-color:var(--pri)}
.wk{display:flex;align-items:flex-end;gap:6px;height:110px}.wk div{flex:1;text-align:center;font-size:10px;color:var(--mut)}.wk i{display:block;background:var(--pri);border-radius:6px 6px 0 0;margin-bottom:3px}
svg text{font-family:inherit}
.onlyprint{display:none}
@media print{body{background:#fff}nav,#toast,.noprint,.modal,.seg{display:none!important}#app{max-width:none;padding:0}.card{box-shadow:none;border:1px solid #ddd;break-inside:avoid}.onlyprint{display:block}.hero{background:#4F46E5!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}svg,.pv .b i,.prog i,.cal .d{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script>
'use strict';
/* ============ DATOS ============ */
const KEY='myfin_v1';
let DB; try{DB=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){DB=null}
DB=DB||{users:{},session:null};
const persist=()=>localStorage.setItem(KEY,JSON.stringify(DB));
let D=null;
const CATS0=[['vivienda','🏠','Vivienda',35],['comida','🍽️','Comida',20],['transporte','🚌','Transporte',7],['ocio','🎉','Ocio',12],['suscripciones','📺','Suscripciones',3],['compras','🛍️','Compras',8],['deporte','🏋️','Deporte',4],['estudios','📚','Estudios',5],['otros','📦','Otros',6]];
const S={screen:'welcome',tab:'home',view:null,auth:{mode:'new',email:'',pass:'',name:'',err:''},ob:{step:3,type:'fixed',income:'',saveMode:'none',saveValue:'',method:'manual'},
  draft:null,exp:null,back:'home',catId:null,filters:{cat:'',sort:'date'},modal:null,nm:{income:'',checks:{},choice:{}},closeKey:null,imp:null,rep:{seg:'mes',day:null}};

/* ============ UTILIDADES ============ */
const $id=i=>document.getElementById(i);
const r2=n=>Math.round((+n||0)*100)/100;
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isNaN(n)?0:n};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>{const v=r2(n);return v.toLocaleString('es-ES',{minimumFractionDigits:Number.isInteger(v)?0:2,maximumFractionDigits:2})+' €'};
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayISO=()=>iso(new Date());
const mkey=d=>d.slice(0,7);
const curKey=()=>todayISO().slice(0,7);
const shiftKey=(k,n)=>{const [y,m]=k.split('-').map(Number);const d=new Date(y,m-1+n,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)};
const mLabel=k=>{const [y,m]=k.split('-').map(Number);const s=new Date(y,m-1,1).toLocaleDateString('es-ES',{month:'long',year:'numeric'});return s.charAt(0).toUpperCase()+s.slice(1)};
const dim=k=>{const [y,m]=k.split('-').map(Number);return new Date(y,m,0).getDate()};
const dLabel=d=>{const t=todayISO();if(d===t)return'Hoy';const y=new Date();y.setDate(y.getDate()-1);if(d===iso(y))return'Ayer';const [yy,mm,dd]=d.split('-').map(Number);return dd+' '+new Date(yy,mm-1,dd).toLocaleDateString('es-ES',{month:'long'})};
const uid=()=>'x'+Math.random().toString(36).slice(2,9);
function fhash(s){let a=5381,b=52711;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);a=((a*33)^c)>>>0;b=((b*31)+c*17)>>>0}return 'f'+a.toString(16)+b.toString(16)+s.length}
async function sha(s){try{if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('')}}catch(e){}return fhash(s)}
let tt;function toast(msg){const t=$id('toast');t.textContent=msg;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),3200)}
function notify(msg){toast(msg);try{if(D&&D.ui.notif&&'Notification' in window&&Notification.permission==='granted')new Notification('MyFin',{body:msg})}catch(e){}}

/* ============ LÓGICA ============ */
const save=()=>{if(D)D.updatedAt=Date.now();persist();if(typeof gAutoSync==='function')gAutoSync()};
const catOf=id=>D.cats.find(c=>c.id===id);
const catName=id=>{const c=catOf(id);return c?c.emoji+' '+c.name:'❔ Sin categoría'};
const saveAmt=m=>m.saveMode==='fixed'?r2(m.saveValue):m.saveMode==='pct'?r2(m.income*m.saveValue/100):0;
const baseBudget=(m,id)=>{const a=+m.alloc[id]||0;return m.method==='pct'?r2(m.income*a/100):r2(a)};
const catBudget=(k,id)=>{const m=D.months[k];if(!m)return 0;return Math.max(0,r2(baseBudget(m,id)-(+m.carry[id]||0)+((m.bonus||{})[id]||0)))};
const spentCat=(k,id)=>r2(D.expenses.filter(e=>mkey(e.date)===k&&e.cat===id&&!e.nb).reduce((s,e)=>s+e.amount,0));
const spentTot=k=>r2(D.expenses.filter(e=>mkey(e.date)===k&&!e.nb).reduce((s,e)=>s+e.amount,0));
const stateCls=(sp,b)=>{if(b<=0)return sp>0?'r':'g';const p=sp/b;return p>1?'r':p>=0.8?'y':'g'};
const prevMonthKey=k=>Object.keys(D.months).filter(x=>x<k).sort().pop();
function projection(k){const m=D.months[k];const sp=spentTot(k);if(k!==curKey())return r2(m.income-sp);const day=new Date().getDate();return r2(m.income-(sp/day)*dim(k))}
function excesses(k){const m=D.months[k];if(!m)return[];return D.cats.map(c=>({id:c.id,ex:r2(spentCat(k,c.id)-catBudget(k,c.id))})).filter(x=>x.ex>0.004&&catBudget(k,x.id)>0)}

/* ============ ACCIONES ============ */
const A={
  go(tab,opts){opts=opts||{};S.tab=tab;S.screen='app';if(tab==='budget')S.draft=null;if(tab==='add'){S.back=opts.back||(S.tab==='add'?'home':S.back);S.exp=opts.exp||{id:null,amount:'',cat:opts.cat||(D.cats[0]&&D.cats[0].id)||'',date:todayISO(),note:''}}if(opts.cat&&tab==='cat')S.catId=opts.cat;render();window.scrollTo(0,0)},
  nav(tab){if(tab==='add'){S.back=S.tab==='add'?'home':S.tab;A.go('add',{back:S.back})}else A.go(tab)},
  month(n){S.view=shiftKey(S.view,n);S.draft=null;S.rep.day=null;S.nm={income:'',checks:{},choice:{}};render()},
  start(){S.auth.mode='new';S.screen='auth';render()},
  haveAcc(){S.auth.mode='login';S.screen='auth';render()},
  authSet(f,v){S.auth[f]=v},
  async submitAuth(){
    const a=S.auth,email=a.email.trim().toLowerCase();
    if(!/^\S+@\S+\.\S+$/.test(email)){a.err='Introduce un email válido';return render()}
    if(a.pass.length<6){a.err='La contraseña debe tener al menos 6 caracteres';return render()}
    const h=await sha(a.pass);
    if(a.mode==='new'){
      if(DB.users[email]){a.err='Ya existe una cuenta con ese email';return render()}
      DB.users[email]={hash:h,data:{name:a.name.trim()||email.split('@')[0],email:email,settings:{onboarded:false,incomeType:'fixed',fixedIncome:0,saveMode:'none',saveValue:0,method:'manual'},cats:CATS0.map(c=>({id:c[0],emoji:c[1],name:c[2]})),months:{},expenses:[],goals:[],rules:{},pending:{},ui:{dark:false,notif:false}}};
      DB.session=email;D=DB.users[email].data;save();a.err='';S.screen='ob';S.ob.step=3;render()
    }else{
      const u=DB.users[email];if(!u||(u.hash!==h&&u.hash!==fhash(a.pass))){a.err='Email o contraseña incorrectos';return render()}
      DB.session=email;D=u.data;save();a.err='';A.afterLogin()
    }
  },
  afterLogin(){ensureData();runAutos();applyTheme();S.view=curKey();if(!D.settings.onboarded){S.screen='ob';S.ob.step=3}else{S.screen='app';S.tab='home'}render()},
  obSet(f,v){S.ob[f]=v},
  obPick(f,v){S.ob[f]=v;render()},
  obNext(){
    const o=S.ob;
    if(o.step===3){if(num(o.income)<=0){toast('Introduce un ingreso mayor que 0');return}o.step=4}
    else if(o.step===4){if(o.saveMode!=='none'&&num(o.saveValue)<=0){toast('Introduce una cantidad de ahorro');return}
      if(o.saveMode==='pct'&&num(o.saveValue)>=100){toast('El porcentaje debe ser menor que 100');return}
      if(o.saveMode==='fixed'&&num(o.saveValue)>=num(o.income)){toast('El ahorro debe ser menor que el ingreso');return}o.step=5}
    else if(o.step===5){S.draft={k:'ob',method:o.method,alloc:{}};o.step=6}
    else if(o.step===6){if(!distValid(S.draft,num(o.income),obSave())){toast('Revisa el reparto antes de continuar');return}o.step=7}
    render();window.scrollTo(0,0)
  },
  obBack(){const o=S.ob;if(o.step>3){o.step--;if(o.step===6)o.step=5;render()}},
  obFinish(){
    const o=S.ob,k=curKey(),inc=num(o.income);
    D.settings=Object.assign(D.settings,{onboarded:true,incomeType:o.type,fixedIncome:o.type==='fixed'?inc:0,saveMode:o.saveMode,saveValue:num(o.saveValue),method:S.draft.method});
    D.months[k]={income:inc,saveMode:o.saveMode,saveValue:num(o.saveValue),method:S.draft.method,alloc:cloneAlloc(S.draft.alloc),carry:{},bonus:{},closed:false};
    save();S.draft=null;S.screen='app';S.tab='home';S.view=k;render()
  },
  dist(id,v){S.draft.alloc[id]=v===''?'':num(v);updDist()},
  suggest(){
    const d=S.draft,ctx=distCtx();const pc=D.cats.map(c=>{const f=CATS0.find(x=>x[0]===c.id);return[c.id,f?f[3]:5]});const tot=pc.reduce((s,x)=>s+x[1],0);
    pc.forEach(([id,p])=>{const share=p/tot;d.alloc[id]=d.method==='pct'?r2(ctx.availPct*share):r2((ctx.income-ctx.save)*share)});
    render()
  },
  toggleMethod(){
    const d=S.draft,ctx=distCtx();const to=d.method==='pct'?'manual':'pct';
    D.cats.forEach(c=>{const v=+d.alloc[c.id]||0;d.alloc[c.id]=to==='pct'?r2(v/ctx.income*100):r2(v*ctx.income/100)});
    d.method=to;if(S.screen==='ob')S.ob.method=to;render()
  },
  modal(type,id){S.modal={type:type,id:id||null,v:'',v2:'',f:{}};if(typeof initModal==='function')initModal(S.modal);
    if(type==='cat-rename'){S.modal.v=catOf(id).name}
    if(type==='income'){const m=D.months[S.view];S.modal.v=m?String(m.income):''}
    if(type==='saving'){const m=D.months[S.view];S.modal.v=m?m.saveMode:'none';S.modal.v2=m&&m.saveValue?String(m.saveValue):''}
    render()},
  mset(f,v){S.modal[f]=v},
  mpick(v){S.modal.v=v;render()},
  closeModal(){S.modal=null;render()},
  modalOk(){
    const M=S.modal;
    if(M.type==='cat-add'||M.type==='cat-rename'){
      const n=M.v.trim();if(!n){toast('Escribe un nombre');return}
      if(M.type==='cat-add')D.cats.push({id:uid(),emoji:'🔖',name:n});else catOf(M.id).name=n;
      save();S.modal=null;render()
    }else if(M.type==='income'){
      const v=num(M.v);if(v<=0){toast('Introduce un importe válido');return}
      const m=D.months[S.view];const old=m.income;m.income=v;
      if(m.method==='manual'&&old>0&&confirm('¿Recalcular el reparto proporcionalmente al nuevo ingreso?\n(Cancelar = mantener los importes actuales)')){Object.keys(m.alloc).forEach(id=>m.alloc[id]=r2(m.alloc[id]*v/old))}
      if(D.settings.incomeType==='fixed')D.settings.fixedIncome=v;
      save();S.modal=null;S.draft=null;toast('Ingreso actualizado');render()
    }else if(M.type==='saving'){
      const m=D.months[S.view];const val=num(M.v2);
      if(M.v!=='none'&&val<=0){toast('Introduce un valor');return}
      m.saveMode=M.v;m.saveValue=M.v==='none'?0:val;D.settings.saveMode=m.saveMode;D.settings.saveValue=m.saveValue;
      save();S.modal=null;S.draft=null;toast('Ahorro actualizado');render()
    }
  },
  delCat(id){if(!confirm('¿Eliminar esta categoría? Sus gastos quedarán como "Sin categoría".'))return;D.cats=D.cats.filter(c=>c.id!==id);Object.values(D.months).forEach(m=>{delete m.alloc[id];delete m.carry[id]});if(S.draft)delete S.draft.alloc[id];save();render()},
  saveBudget(){
    const m=D.months[S.view],d=S.draft;
    if(!distValid(d,m.income,saveAmt(m))){toast('Revisa el reparto: no se puede guardar');return}
    m.method=d.method;m.alloc=cloneAlloc(d.alloc);D.settings.method=d.method;save();toast('Presupuesto actualizado');S.draft=null;render()
  },
  nmSet(v){S.nm.income=v},
  expSet(f,v){S.exp[f]=v;if(f==='amount'||f==='date')updHint()},
  expCat(id){S.exp.cat=id;render()},
  expDate(v){S.exp.date=v;updHint()},
  saveExp(){
    const e=S.exp,amt=r2(num(e.amount));
    if(amt<=0){toast('Introduce un importe');return}
    if(!e.cat||!catOf(e.cat)){toast('Elige una categoría');return}
    if(!e.date){toast('Elige una fecha');return}
    const k=mkey(e.date),before=spentCat(k,e.cat);
    if(e.id){const x=D.expenses.find(z=>z.id===e.id);spendAdj(x,1);Object.assign(x,{amount:amt,cat:e.cat,date:e.date,note:e.note.trim()},x.src==='bank'?{}:{acc:payAcc(e),nb:payNb(e)});spendAdj(x,-1)}
    else{const nx={id:uid(),amount:amt,cat:e.cat,date:e.date,note:e.note.trim(),acc:payAcc(e),nb:payNb(e)};D.expenses.push(nx);spendAdj(nx,-1)}
    save();
    const b=catBudget(k,e.cat),after=spentCat(k,e.cat),name=catOf(e.cat).name.toLowerCase();
    if(payNb(e)){const pa=accById(payAcc(e));toast('Gasto con cargo a '+(pa?pa.name:'ahorros')+(pa?': quedan '+money(pa.balance):''))}
    else if(D.months[k]&&b>0&&after>b&&before<=b+0.001)notify('Te has pasado '+money(after-b)+' en '+name);
    else if(D.months[k]&&b>0&&after>b)notify('Sigues por encima en '+name+': +'+money(after-b));
    else if(D.months[k])toast((e.id?'Gasto actualizado':'Gasto añadido')+' · Te quedan '+money(b-after)+' en '+name);
    else toast('Gasto guardado');
    S.view=k;const bk=S.back==='cat'?'cat':S.back==='moves'?'moves':'home';A.go(bk)
  },
  editExp(id){const x=D.expenses.find(z=>z.id===id);S.back=S.tab;A.go('add',{back:S.tab,exp:{id:x.id,amount:String(x.amount),cat:x.cat,date:x.date,note:x.note||'',bank:x.src==='bank',src:(x.acc&&x.acc!==D.settings.spendAcc)?x.acc:'paga',count:!x.nb}})},
  delExp(id){if(!confirm('¿Eliminar este gasto?'))return;spendAdj(D.expenses.find(x=>x.id===id),1);D.expenses=D.expenses.filter(x=>x.id!==id);save();toast('Gasto eliminado');render()},
  openCat(id){S.catId=id;A.go('cat')},
  filt(f,v){S.filters[f]=v;render()},
  closeMonth(k){S.closeKey=k;S.tab='close';render();window.scrollTo(0,0)},
  confirmClose(next){const k=S.closeKey;D.months[k].closed=true;save();if(next){S.view=shiftKey(k,1);S.nm={income:'',checks:{},choice:{}};A.go('home')}else{S.view=k;A.go('budget')}},
  reset(){if(!confirm('¿Reiniciar el presupuesto de este mes? Se borrará el reparto, pero no tus gastos.'))return;const m=D.months[S.view];m.alloc={};m.carry={};save();S.draft=null;toast('Presupuesto reiniciado');A.go('budget')},
  dark(){D.ui.dark=!D.ui.dark;applyTheme();save();render()},

  exportData(){const b=new Blob([JSON.stringify(D,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='myfin-datos.json';a.click()},
  logout(){DB.session=null;save();D=null;S.screen='welcome';render()},

};
const cloneAlloc=a=>{const o={};Object.keys(a).forEach(k=>o[k]=a[k]===''?0:+a[k]);return o};
function applyTheme(){document.documentElement.setAttribute('data-theme',D&&D.ui.dark?'dark':'light')}

/* ============ REPARTO (componente compartido) ============ */
function obSave(){const o=S.ob;return o.saveMode==='fixed'?r2(num(o.saveValue)):o.saveMode==='pct'?r2(num(o.income)*num(o.saveValue)/100):0}
function distCtx(){
  const d=S.draft;let income,save_;
  if(S.screen==='ob'){income=num(S.ob.income);save_=obSave()}else{const m=D.months[S.view];income=m.income;save_=saveAmt(m)}
  const availPct=r2(100-save_/income*100);
  const used=D.cats.reduce((s,c)=>s+(+d.alloc[c.id]||0),0);
  const avail=d.method==='pct'?availPct:r2(income-save_);
  return{income:income,save:save_,availPct:availPct,avail:avail,used:r2(used),rest:r2(avail-used),method:d.method}
}
function distValid(d,income,save_){
  const used=D.cats.reduce((s,c)=>s+(+d.alloc[c.id]||0),0);
  if(d.method==='pct'){const avail=100-save_/income*100;return Math.abs(avail-used)<0.011}
  return used<=income-save_+0.005
}
function distSummaryHTML(){
  const c=distCtx(),pct=c.method==='pct',f=n=>pct?r2(n)+'%':money(n);
  const bad=c.rest<-0.005,ok=pct?Math.abs(c.rest)<0.011:c.rest>=-0.005;
  return '<div class="row"><span>Ingreso</span><b>'+money(c.income)+'</b></div>'+
   '<div class="row"><span>Ahorro</span><b>'+(c.save?money(c.save)+(pct?' ('+r2(100-c.availPct)+'%)':''):'—')+'</b></div>'+
   '<div class="row"><span>'+(pct?'Porcentaje a repartir':'Disponible para repartir')+'</span><b>'+f(c.avail)+'</b></div>'+
   '<div class="row"><span>'+(pct?'Usado':'Ya repartido')+'</span><b>'+f(c.used)+'</b></div>'+
   '<div class="row"><span>Restante</span><b class="'+(bad?'neg':ok&&Math.abs(c.rest)<0.011?'pos':'')+'">'+f(c.rest)+'</b></div>'+
   (bad?'<div class="neg" style="margin-top:4px">⚠️ Te has pasado '+f(-c.rest)+'</div>':pct&&!ok?'<div class="tiny" style="margin-top:4px">Te queda un '+r2(c.rest)+'% sin asignar. Hay que llegar al 100%.</div>':'')
}
function distRowsHTML(extra){
  const d=S.draft,ctx=distCtx();
  return D.cats.map(c=>{const v=d.alloc[c.id];const amt=d.method==='pct'?money(ctx.income*(+v||0)/100):'';
    return '<div class="dr"><div>'+c.emoji+' '+esc(c.name)+(extra?extra(c):'')+'</div><input type="number" inputmode="decimal" step="0.01" min="0" placeholder="0" value="'+(v===undefined||v===''||v===0?'':v)+'" oninput="A.dist(\''+c.id+'\',this.value)"><div class="c" id="amt-'+c.id+'">'+(d.method==='pct'?amt:'€')+'</div></div>'}).join('')
}
function updDist(){
  const s=$id('distSum');if(s)s.innerHTML=distSummaryHTML();
  const ctx=distCtx();if(S.draft.method==='pct')D.cats.forEach(c=>{const e=$id('amt-'+c.id);if(e)e.textContent=money(ctx.income*(+S.draft.alloc[c.id]||0)/100)});
  const b=$id('distBtn');if(b)b.disabled=!distValid(S.draft,ctx.income,ctx.save)
}

const goalSaved=g=>r2(g.contribs.reduce((s,c)=>s+c.amount,0));
const goalMonth=(g,k)=>r2(g.contribs.filter(c=>c.month===k).reduce((s,c)=>s+c.amount,0));
const monthDiff=(a,b)=>{const[ay,am]=a.split('-').map(Number),[by,bm]=b.split('-').map(Number);return(by-ay)*12+(bm-am)};
const fmtD=d=>d.slice(8)+'/'+d.slice(5,7)+'/'+d.slice(0,4);
function extraAvail(k){const m=D.months[k];if(!m)return 0;return Math.max(0,r2(m.income-spentTot(k)-saveAmt(m)-(m.distributed||0)))}
function addContrib(g,amount,type,k,accId,toId){const c={id:uid(),month:k,date:todayISO(),amount:r2(amount),type:type};const a=accId&&accById(accId);if(a){a.balance=r2(a.balance-amount);logTx(a.id,-amount,'goal',(amount>=0?'Aportación a ':'Retirada de ')+g.name);c.acc=a.id}const dId=toId===undefined?g.toAcc:toId;const d=dId&&accById(dId);if(d){d.balance=r2(d.balance+amount);logTx(d.id,amount,'goal',(amount>=0?'Aportación a ':'Retirada de ')+g.name);c.to=d.id}g.contribs.push(c)}
function undoContrib(g,c){const a=c.acc&&accById(c.acc),d=c.to&&accById(c.to);if(a){a.balance=r2(a.balance+c.amount);logTx(a.id,c.amount,'goal','Anulada aportación a '+g.name)}if(d){d.balance=r2(d.balance-c.amount);logTx(d.id,-c.amount,'goal','Anulada aportación a '+g.name)}}

function goalInfo(g){
  const sv=goalSaved(g),rem=Math.max(0,r2(g.target-sv)),pct=g.target>0?Math.min(100,sv/g.target*100):0;let eta='',need='';
  if(rem<=0)eta='¡Objetivo conseguido! 🎉';
  else if(g.monthly>0){const n=Math.ceil(rem/g.monthly);eta='Con '+money(g.monthly)+'/mes llegas en '+n+(n>1?' meses':' mes')+' ('+mLabel(shiftKey(curKey(),n))+')'}
  else eta='Sin aportación mensual definida';
  if(rem>0&&g.deadline){const n=Math.max(1,monthDiff(curKey(),g.deadline)+1);need='Para llegar en '+mLabel(g.deadline)+' necesitas '+money(rem/n)+'/mes'+(g.monthly>0&&g.monthly+0.005<rem/n?' ⚠️ (ahora planeas '+money(g.monthly)+')':' ✅')}
  return{sv:sv,rem:rem,pct:pct,eta:eta,need:need}
}

     (g.contribs.length?'<details style="margin-top:8px"><summary class="tiny">Historial ('+g.contribs.length+')</summary>'+g.contribs.slice().reverse().map(c=>'<div class="mv" style="padding:6px 0"><div><b>'+(c.amount>=0?'+':'')+money(c.amount)+'</b><small>'+fmtD(c.date)+' · '+(c.type==='extra'?'extra de '+mLabel(c.month):c.type==='plan'?'aportación mensual':'manual')+'</small></div><button class="btn danger sm" onclick="A.delContrib(\''+g.id+'\',\''+c.id+'\')">✕</button></div>').join('')+'</details>':'')+'</div>'
  }).join('')

const IMP={

  parse(text){

const TYPES={corriente:'Cuenta corriente',remunerada:'Cuenta remunerada',deposito:'Depósito / fondo remunerado',inversion:'Inversión'};
const TEMO={corriente:'🏦',remunerada:'💰',deposito:'🔒',inversion:'📈'};
const FREQ={diaria:['Diaria',1],mensual:['Mensual',1],trimestral:['Trimestral',3],semestral:['Semestral',6],anual:['Anual',12]};
const accById=id=>(D.accounts||[]).find(a=>a.id===id);
const taxF=()=>1-(+D.settings.taxPct||0)/100;
const periodMonths=a=>(FREQ[a.freq]||FREQ.mensual)[1];
const periodInterest=(a,bal)=>bal*(Math.pow(1+(+a.tae||0)/100,periodMonths(a)/12)-1);
const dparse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
function addMonthsISO(s,n){const d=dparse(s);return iso(new Date(d.getFullYear(),d.getMonth()+n,Math.min(d.getDate(),28)))}
function logTx(accId,amount,type,note,date){D.atx.push({id:uid(),acc:accId,amount:r2(amount),type:type,note:note||'',date:date||todayISO()})}
function moveMoney(from,to,amount,note,type,date){
  const fa=accById(from),ta=accById(to);
  if(fa){fa.balance=r2(fa.balance-amount);logTx(from,-amount,type||'transfer',note,date)}
  if(ta){ta.balance=r2(ta.balance+amount);logTx(to,amount,type||'transfer',note,date)}
}
function spendAdj(x,sign){if(!x||x.src==='bank'||!x.acc)return;const a=accById(x.acc);if(a)a.balance=r2(a.balance+sign*x.amount)}
function totalWealth(){return r2(D.accounts.reduce((s,a)=>s+a.balance,0))}
function flowIncome(){const sp=D.settings.spendAcc;if(!sp)return 0;return r2(D.flows.filter(f=>f.to===sp&&f.from!==sp).reduce((s,f)=>s+f.amount,0))}
function expectedExpense(){
  const cur=curKey(),ks=Object.keys(D.months).filter(k=>k<cur&&spentTot(k)>0).sort().slice(-3);
  if(ks.length)return r2(ks.reduce((s,k)=>s+spentTot(k),0)/ks.length);

function pendingInterest(a){
  if(!paysInt(a)||!(a.tae>0)||a.balance<=0)return null;
  const pm=periodMonths(a),today=dparse(todayISO()),last=a.lastInt||todayISO();let n=0;
  for(let i=1;i<=60;i++){if(dparse(addMonthsISO(last,pm*i))<=today)n=i;else break}
  if(!n)return null;

}
function dueCount(f){const cur=curKey();let n=monthDiff(f.last||cur,cur);if(new Date().getDate()<f.day)n-=1;return Math.max(0,Math.min(n,12))}
function applyFlow(f,times){for(let i=1;i<=times;i++){const k=shiftKey(f.last,i);moveMoney(f.from,f.to,f.amount,f.name,f.from==='ext'?'income':'transfer',k+'-'+pad(Math.min(f.day,28)))}f.last=shiftKey(f.last,times)}

function project(N,expM,opts){opts=opts||{};
  const accs=D.accounts.map(a=>({a:a,bal:a.balance,acr:0,int:0,ser:[a.balance],zero:null,contrib:0})),by={};accs.forEach(x=>by[x.a.id]=x);
  for(let m=1;m<=N;m++){
    D.flows.forEach(f=>{if(by[f.from]){by[f.from].bal-=f.amount;by[f.from].contrib-=f.amount}if(by[f.to]){by[f.to].bal+=f.amount;by[f.to].contrib+=f.amount}});if(opts.extra&&by[opts.extra.acc]){by[opts.extra.acc].bal+=opts.extra.amt;by[opts.extra.acc].contrib+=opts.extra.amt}
    const sp=by[D.settings.spendAcc];if(expM>0&&sp){sp.bal-=expM;sp.contrib-=expM}
    accs.forEach(x=>{const a=x.a;
      if((paysInt(a)||a.type==='inversion')&&a.tae>0){
        const pm=a.type==='inversion'?1:periodMonths(a),n=12/pm,t=Math.max(0,a.tae+(opts.dtae||0))/100,rm=n*(Math.pow(1+t,1/n)-1)/12;
        if(x.bal>0)x.acr+=x.bal*rm;
        if(m%pm===0){const c=x.acr*(paysInt(a)?taxF():1);x.bal+=c;x.int+=c;x.acr=0}
      }
      if(x.zero===null&&x.bal<0)x.zero=m;
      x.ser.push(r2(x.bal))});
  }
  return accs
}

  const hi=Math.max.apply(null,flat.concat([1]))*1.08,lo=Math.min(0,Math.min.apply(null,flat)*1.08),W=320,H=190,L=40,R=8,T=10,B=22;
  const x=i=>L+(W-L-R)*i/Math.max(1,N),y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));
  let s='';[lo<0?lo:null,0,hi/1.08/2,hi/1.08].forEach(v=>{if(v===null)return;s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v).toFixed(1)+'" y2="'+y(v).toFixed(1)+'" stroke="var(--line)"></line><text x="'+(L-4)+'" y="'+(y(v)+3).toFixed(1)+'" text-anchor="end" font-size="8" fill="var(--mut)">'+Math.round(v)+'</text>'});

  const line=(ser,col,w)=>{let p='';ser.forEach((v,i)=>{p+=(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)+' '});return'<path d="'+p+'" fill="none" stroke="'+col+'" stroke-width="'+w+'" stroke-linejoin="round"></path>'};
  res.forEach((r,i)=>{s+=line(r.ser,PAL[i%PAL.length],1.8)});s+=line(tot,'var(--tx)',2.8);
  return'<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto">'+s+'</svg><div class="tiny" style="display:flex;gap:10px;flex-wrap:wrap">'+res.map((r,i)=>'<span><b style="color:'+PAL[i%PAL.length]+'">━</b> '+esc(r.a.name)+'</span>').join('')+'<span><b>━</b> Total</span></div>'
}

function wealthOkOld(M){
  if(WM.indexOf(M.type)<0)return false;const f=M.f;if(invOk(M))return true;
  if(M.type==='acct'){
    if(!f.name.trim()){toast('Ponle un nombre');return true}
    const bal=num(f.balance),tae=f.type==='corriente'?0:num(f.tae);
    if(M.id){const a=accById(M.id);Object.assign(a,{name:f.name.trim(),type:f.type,tae:tae,freq:f.freq,emoji:TEMO[f.type],maturity:f.type==='deposito'?(f.maturity||''):''});if(Math.abs(bal-a.balance)>0.004){logTx(a.id,bal-a.balance,'adjust','Ajuste de saldo');a.balance=r2(bal)}}
    else{if(D.accounts.length>=2&&!needPlus('accounts'))return true;const a={id:uid(),name:f.name.trim(),type:f.type,emoji:TEMO[f.type],balance:r2(bal),tae:tae,freq:f.freq,lastInt:todayISO(),maturity:f.type==='deposito'?(f.maturity||''):''};D.accounts.push(a);if(!D.settings.spendAcc&&f.type==='corriente')D.settings.spendAcc=a.id}
    save();S.modal=null;toast('Cuenta guardada');render();return true}
  if(M.type==='flow'){
    const amt=num(f.amount),day=Math.max(1,Math.min(28,Math.round(num(f.day))||1));
    if(!f.name.trim()){toast('Ponle un nombre');return true}if(amt<=0){toast('Introduce un importe');return true}
    if(f.from===f.to){toast('El origen y el destino no pueden ser iguales');return true}
    if(M.id){const x=D.flows.find(z=>z.id===M.id);Object.assign(x,{name:f.name.trim(),from:f.from,to:f.to,amount:amt,day:day,auto:!!f.auto})}
    else D.flows.push({id:uid(),name:f.name.trim(),from:f.from,to:f.to,amount:amt,day:day,auto:!!f.auto,last:curKey()});
    save();S.modal=null;toast('Flujo guardado');render();return true}
  if(M.type==='xfer'){
    const amt=num(f.amount);if(amt<=0){toast('Introduce un importe');return true}if(f.from===f.to){toast('Elige cuentas distintas');return true}
    moveMoney(f.from,f.to,amt,f.note||'Traspaso',f.from==='ext'?'income':'transfer');save();S.modal=null;toast('Movimiento registrado');render();return true}
  if(M.type==='adjust'){
    const a=accById(M.id),v=num(f.balance);if(Math.abs(v-a.balance)>0.004){logTx(a.id,v-a.balance,'adjust','Ajuste de saldo');a.balance=r2(v)}
    save();S.modal=null;toast('Saldo actualizado');render();return true}
  if(M.type==='interest'){
    const a=accById(M.id),v=num(f.amount);if(v<=0){toast('Introduce un importe');return true}
    const p=pendingInterest(a);a.lastInt=p?addMonthsISO(a.lastInt||todayISO(),periodMonths(a)*p.n):todayISO();
    a.balance=r2(a.balance+v);logTx(a.id,v,'interest','Intereses');save();S.modal=null;toast('Intereses registrados: '+money(v));render();return true}
  return false
}

function gLoad(){return new Promise((res,rej)=>{if(window.google&&google.accounts&&google.accounts.oauth2)return res();const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.onload=()=>res();s.onerror=()=>rej(new Error('No se pudo cargar Google (¿sin conexión?)'));document.head.appendChild(s)})}
async function gToken(scopes){
  const cid=gClient();if(!cid)throw new Error('Google aún no está configurado en esta app (falta el ID de cliente)');
  if(location.protocol==='file:')throw new Error('Google no permite conectar desde un archivo local (file://). Abre MyFin desde una dirección https:// o http://localhost.');
  if(G.token&&Date.now()<G.exp&&scopes.every(s=>G.scopes.indexOf(s)>=0))return G.token;
  await gLoad();
  return new Promise((res,rej)=>{
    const all=Array.from(new Set(G.scopes.concat(scopes)));
    const tc=google.accounts.oauth2.initTokenClient({client_id:cid,scope:all.join(' '),
      callback:r=>{if(r.error)return rej(new Error(r.error_description||r.error));G.token=r.access_token;G.exp=Date.now()+(r.expires_in-60)*1000;G.scopes=all;res(G.token)},
      error_callback:e=>rej(new Error(e.message||e.type||'Autorización cancelada'))});
    tc.requestAccessToken({prompt:G.token?'':'consent'})
  })
}
async function gFetch(url,opts,scopes){
  const t=await gToken(scopes);opts=opts||{};opts.headers=Object.assign({Authorization:'Bearer '+t},opts.headers||{});
  const r=await fetch(url,opts);
  if(!r.ok){let m=String(r.status);try{const j=await r.json();m=(j.error&&j.error.message)||m}catch(e){}throw new Error('Google: '+m)}
  const ct=r.headers.get('content-type')||'';return ct.indexOf('json')>=0?r.json():r.text()
}
async function gDriveFind(){const r=await gFetch('https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q='+encodeURIComponent("name='myfin-data.json'")+'&fields=files(id,modifiedTime)',{},[SC_DRIVE]);return(r.files||[])[0]||null}
async function gDriveUpload(id){
  const body=JSON.stringify(D);
  if(id)return gFetch('https://www.googleapis.com/upload/drive/v3/files/'+id+'?uploadType=media',{method:'PATCH',headers:{'Content-Type':'application/json'},body:body},[SC_DRIVE]);
  const bd='myfinb'+Date.now(),meta=JSON.stringify({name:'myfin-data.json',parents:['appDataFolder']});
  const mp='--'+bd+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+meta+'\r\n--'+bd+'\r\nContent-Type: application/json\r\n\r\n'+body+'\r\n--'+bd+'--';
  return gFetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+bd},body:mp},[SC_DRIVE])
}

  try{gBusy('Conectando con Google Drive…');
    const f=await gDriveFind(),cfg=gCfg();
    if(!f){await gDriveUpload(null);toast('Copia creada en tu Google Drive')}
    else{
      const remote=await gFetch('https://www.googleapis.com/drive/v3/files/'+f.id+'?alt=media',{},[SC_DRIVE]);
      if(remote&&remote.updatedAt>(D.updatedAt||0)){
        if(confirm('La copia de Google Drive es más reciente ('+new Date(remote.updatedAt).toLocaleString('es-ES')+'). ¿Descargarla y reemplazar los datos de este dispositivo?')){
          remote.settings=remote.settings||{};remote.settings.google=cfg;DB.users[DB.session].data=remote;D=remote;persist();applyTheme();toast('Datos descargados de Drive')}
        else toast('Sin cambios')}

  }catch(e){toast(e.message)}finally{S.g.busy='';render()}
};

A.gCalendar=async function(){
  const items=[];D.flows.forEach(f=>items.push({o:f,t:'💸 MyFin: '+f.name+' ('+money(f.amount)+')',day:f.day}));
  D.goals.forEach(g=>{if(g.monthly>0)items.push({o:g,t:'🎯 MyFin: aportar '+money(g.monthly)+' a '+g.name,day:1})});
  if(!items.length){toast('No tienes flujos ni objetivos con aportación mensual');return}
  const todo=items.filter(i=>!i.o.gcal);if(!todo.length){toast('Ya están creados todos los recordatorios');return}
  try{gBusy('Creando eventos en Google Calendar…');let n=0;
    for(const it of todo){const now=new Date();let mo=now.getMonth();if(now.getDate()>it.day)mo++;
      const d0=new Date(now.getFullYear(),mo,it.day),d1=new Date(now.getFullYear(),mo,it.day+1);
      const ev=await gFetch('https://www.googleapis.com/calendar/v3/calendars/primary/events',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({summary:it.t,start:{date:iso(d0)},end:{date:iso(d1)},recurrence:['RRULE:FREQ=MONTHLY'],reminders:{useDefault:false,overrides:[{method:'popup',minutes:480}]}})},[SC_CAL]);
      it.o.gcal=ev.id;n++}
    save();toast('Creados '+n+' recordatorios mensuales')
  }catch(e){toast(e.message)}finally{S.g.busy='';render()}
};

function positions(){
  const m={};
  D.inv.tx.slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(t=>{
    const p=m[t.key]=m[t.key]||{key:t.key,name:t.name,isin:t.isin,units:0,cost:0,real:0,div:0,first:t.date};
    if(t.type==='buy'){p.units+=t.units;p.cost+=t.amount+(t.fee||0)}
    else if(t.type==='sell'){const avg=p.units>0?p.cost/p.units:0,cu=Math.min(t.units,p.units);p.real+=t.amount-(t.fee||0)-avg*cu;p.cost-=avg*cu;p.units-=cu}
    else if(t.type==='div')p.div+=t.amount;
    if(t.name)p.name=t.name;if(t.isin)p.isin=t.isin});
  return Object.keys(m).map(k=>{const p=m[k],px=D.inv.px[k];
    p.units=Math.abs(p.units)<1e-9?0:p.units;p.cost=r2(p.cost);p.real=r2(p.real);p.div=r2(p.div);
    p.price=px?px.p:null;p.pdate=px?px.d:null;p.value=(px&&p.units>0)?r2(p.units*px.p):null;
    p.pl=p.value!=null?r2(p.value-p.cost):null;p.plPct=(p.value!=null&&p.cost>0)?p.pl/p.cost*100:null;return p})
    .filter(p=>p.units>0||p.div||p.real).sort((a,b)=>((b.value!=null?b.value:b.cost)-(a.value!=null?a.value:a.cost)))
}
function xirr(P){
  const fl=[];D.inv.tx.forEach(t=>{const d=dparse(t.date);if(t.type==='buy')fl.push([d,-(t.amount+(t.fee||0))]);else if(t.type==='sell')fl.push([d,t.amount-(t.fee||0)]);else if(t.type==='div')fl.push([d,t.amount])});
  const cur=P.reduce((s,p)=>s+(p.units>0?(p.value!=null?p.value:p.cost):0),0);if(cur>0)fl.push([dparse(todayISO()),cur]);
  if(fl.length<2)return null;fl.sort((a,b)=>a[0]-b[0]);const t0=fl[0][0];
  if((fl[fl.length-1][0]-t0)/86400000<60)return null;
  if(!fl.some(x=>x[1]<0)||!fl.some(x=>x[1]>0))return null;
  const f=r=>fl.reduce((s,x)=>s+x[1]/Math.pow(1+r,(x[0]-t0)/31557600000),0);
  let lo=-0.99,hi=10,flo=f(lo);if(flo*f(hi)>0)return null;
  for(let i=0;i<200;i++){const mid=(lo+hi)/2,fm=f(mid);if(Math.abs(fm)<1e-7)return mid;if(flo*fm<0)hi=mid;else{lo=mid;flo=fm}}
  return(lo+hi)/2
}
function portfolio(){
  const P=positions();let cost=0,value=0,div=0,real=0,unk=0;
  P.forEach(p=>{if(p.units>0){cost+=p.cost;value+=(p.value!=null?p.value:p.cost);if(p.price==null)unk++}div+=p.div;real+=p.real});
  return{pos:P,cost:r2(cost),value:r2(value),pl:r2(value-cost),div:r2(div),real:r2(real),unk:unk,xirr:xirr(P)}
}

const TR={
  num(s){s=String(s==null?'':s).trim();if(!s)return null;if(/^-?\d+(\.\d+)?(e-?\d+)?$/i.test(s))return parseFloat(s);return IMP.amount(s)},
  cls(r){
    const txt=(r.types.join(' ')+' '+(r.desc||'')).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    if(/dividend|aussch[uü]ttung|ausschuttung/.test(txt))return'div';
    if(/interest|zins/.test(txt))return'skip';
    if(r.units>0&&/sell|verkauf/.test(txt))return'sell';
    if(r.units>0&&/buy|kauf|sparplan|savings|saveback|round.?up/.test(txt))return'buy';
    if(r.units>0&&r.isin)return r.signed<0?'buy':'sell';
    return'skip'
  },
  parse(text){
    const lines=text.split(/\r?\n/).filter(l=>l.trim());if(lines.length<2)return{rows:[],info:'El archivo está vacío.'};
    let d=',',best=-1;[',',';','\t'].forEach(c=>{const n=lines.slice(0,5).reduce((s,l)=>s+(l.split(c).length-1),0);if(n>best){best=n;d=c}});
    const grid=lines.map(l=>IMP.splitLine(l,d)),nz=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 _]/g,' ').trim(),H=grid[0].map(nz);
    const find=(re,ex)=>H.findIndex(h=>re.test(h)&&!(ex&&ex.test(h)));
    const col={date:find(/^(date|datum|datetime|timestamp|zeit|booking date|buchungsdatum)/),name:find(/^(name|instrument|bezeichnung|titel|security|asset name)/),
      isin:find(/^(isin|symbol|identifier|kennung|wkn|asset id)/),units:find(/^(shares|quantity|qty|anzahl|menge|stuck|units)/),price:find(/(price|kurs|preis)/,/(original|orig)/),
      amount:find(/^(amount|betrag|total|value|wert|net amount)/,/(original|orig|fx|foreign)/),fee:find(/(fee|gebuhr|kosten)/),desc:find(/(description|beschreibung|verwendungszweck|text|note)/),
      id:find(/(transaction id|transaction_id|reference|referenz|booking id|^id$)/)};
    const typeCols=[];H.forEach((h,i)=>{if(/^(type|typ|category|kategorie|subtype|untertyp|transaction type|art)/.test(h))typeCols.push(i)});
    if(col.date<0||(col.amount<0&&col.units<0))return{rows:[],info:'No he reconocido las columnas del archivo. Comprueba que es la «Exportación de transacciones» de Trade Republic.'};
    const rows=[];
    grid.slice(1).forEach(r=>{
      const date=IMP.date(r[col.date]);if(!date)return;
      const idv=col.isin>=0?String(r[col.isin]||'').trim().toUpperCase():'';
      const o={date:date,name:col.name>=0?(r[col.name]||'').trim():'',isin:/^[A-Z]{2}[A-Z0-9]{9}\d$/.test(idv)?idv:'',units:Math.abs(col.units>=0?(TR.num(r[col.units])||0):0),
        price:col.price>=0?Math.abs(TR.num(r[col.price])||0):0,signed:col.amount>=0?(TR.num(r[col.amount])||0):0,fee:col.fee>=0?Math.abs(TR.num(r[col.fee])||0):0,
        desc:col.desc>=0?(r[col.desc]||''):'',types:typeCols.map(i=>r[i]||''),rid:col.id>=0?(r[col.id]||''):''};
      o.amount=Math.abs(o.signed);if(!o.amount&&o.units&&o.price)o.amount=r2(o.units*o.price);
      if(!o.price&&o.units)o.price=o.amount/o.units;
      o.cls=TR.cls(o);if(!o.name)o.name=o.isin||'(sin nombre)';
      rows.push(o)});
    return{rows:rows,info:rows.length?'':'No he encontrado filas con fecha.'}
  }
};

function invOk(M){

    const key=isin||name.toLowerCase();let t;
    if(f.type==='div'){const a=num(f.amount);if(a<=0){toast('Introduce el importe cobrado');return true}t={type:'div',amount:r2(a),units:0,price:0,fee:0}}
    else{const u=num(f.units),p=num(f.price);if(u<=0||p<=0){toast('Introduce participaciones y precio');return true}t={type:f.type,units:u,price:p,amount:r2(u*p),fee:r2(num(f.fee))}}
    D.inv.tx.push(Object.assign({id:uid(),date:f.date||todayISO(),key:key,name:name,isin:isin},t));
    if((f.ticker||'').trim())D.inv.tk[key]=f.ticker.trim();
    save();S.modal=null;toast('Operación guardada');render();return true}
  if(M.type==='px'){const pr=num(f.price);D.inv.tk[M.id]=(f.ticker||'').trim();if(pr>0)D.inv.px[M.id]={p:pr,d:todayISO()};save();S.modal=null;toast('Guardado');render();return true}
  if(M.type==='recon'){let n=0;D.accounts.forEach(a=>{const v=f[a.id];if(v===undefined||v==='')return;const nv=num(v);if(Math.abs(nv-a.balance)>0.004){logTx(a.id,nv-a.balance,'adjust','Cuadre de saldo');a.balance=r2(nv);n++}});D.settings.lastRecon=Date.now();save();S.modal=null;toast(n?'Saldos ajustados: '+n:'Todo cuadra ✅');render();return true}
  return false
}

function takeSnap(){
  if(!D||!D.accounts||!D.accounts.length||S.screen!=='app')return;
  const k=curKey(),tot=totalWealth();let s=D.snaps.find(x=>x.k===k);if(!s){s={k:k};D.snaps.push(s)}
  if(s.total!==tot||s.d!==todayISO()){s.total=tot;s.d=todayISO();s.by={};D.accounts.forEach(a=>{s.by[a.type]=r2((s.by[a.type]||0)+a.balance)});save()}
}
function svgSnaps(sn){
  const W=320,H=180,L=42,R=10,T=12,B=24,vals=sn.map(s=>s.total),hi=Math.max.apply(null,vals.concat([1]))*1.1,lo=Math.min(0,Math.min.apply(null,vals));
  const x=i=>L+(W-L-R)*(sn.length===1?0.5:i/(sn.length-1)),y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));
  let g='';[lo,(lo+hi/1.1)/2,hi/1.1].forEach(v=>{g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v).toFixed(1)+'" y2="'+y(v).toFixed(1)+'" stroke="var(--line)"></line><text x="'+(L-4)+'" y="'+(y(v)+3).toFixed(1)+'" text-anchor="end" font-size="8" fill="var(--mut)">'+Math.round(v)+'</text>'});
  let p='';sn.forEach((s,i)=>{p+=(i?'L':'M')+x(i).toFixed(1)+' '+y(s.total).toFixed(1)+' '});
  const area=sn.length>1?p+'L'+x(sn.length-1).toFixed(1)+' '+y(lo).toFixed(1)+' L'+x(0).toFixed(1)+' '+y(lo).toFixed(1)+' Z':'';
  return'<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto">'+g+'<path d="'+area+'" fill="var(--pri)" opacity=".12"></path><path d="'+p+'" fill="none" stroke="var(--pri)" stroke-width="2.5" stroke-linejoin="round"></path>'+sn.map((s,i)=>'<circle cx="'+x(i).toFixed(1)+'" cy="'+y(s.total).toFixed(1)+'" r="3.5" fill="var(--pri)"></circle><text x="'+x(i).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle" font-size="8" fill="var(--mut)">'+mShort(s.k)+'</text>').join('')+'</svg>'
}

   '<div class="card"><h3>Detalle</h3><div style="overflow-x:auto"><table style="width:100%;font-size:12px;border-collapse:collapse"><tr style="color:var(--mut);text-align:right"><th style="text-align:left">Mes</th><th>Total</th><th>Variación</th></tr>'+sn.map((s,i)=>'<tr style="text-align:right;border-top:1px solid var(--line)"><td style="text-align:left;padding:6px 0">'+mLabel(s.k)+'</td><td>'+Math.round(s.total)+'</td><td class="'+(i&&s.total<sn[i-1].total?'neg':'')+'">'+(i?(s.total-sn[i-1].total>=0?'+':'')+Math.round(s.total-sn[i-1].total):'—')+'</td></tr>').join('')+'</table></div></div>'
}
function wSegBody(seg){
  if(seg==='cuentas')return wCuentas();
  if((seg==='flujos'||seg==='proy')&&!isPlus())return lockedCard('flows');
  if(seg==='flujos')return wFlujos();
  if(seg==='proy')return wProy();
  if(seg==='obj')return vGoals();
  if(seg==='hist')return wHist();
  if(seg==='calc')return wCalc();
  if(seg==='cartera')return isPlus()?wCartera():lockedCard('invest');
  return wCuentas()
}

function realizedYear(y){const m={};let r=0;D.inv.tx.slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(t=>{const p=m[t.key]=m[t.key]||{u:0,c:0};if(t.type==='buy'){p.u+=t.units;p.c+=t.amount+(t.fee||0)}else if(t.type==='sell'){const avg=p.u>0?p.c/p.u:0,cu=Math.min(t.units,p.u);if(t.date.slice(0,4)===y)r+=t.amount-(t.fee||0)-avg*cu;p.c-=avg*cu;p.u-=cu}});return r2(r)}
function repYearOld(){
  const y=S.view.slice(0,4),ks=Object.keys(D.months).filter(k=>k.slice(0,4)===y).sort();
  if(!ks.length)return'<div class="card center"><p>No hay meses de '+y+'. Cambia de año con las flechas.</p></div>';

  const intr=sumArr(D.atx.filter(t=>t.type==='interest'&&yr(t.date)).map(t=>t.amount)),div=sumArr(D.inv.tx.filter(t=>t.type==='div'&&yr(t.date)).map(t=>t.amount)),buys=sumArr(D.inv.tx.filter(t=>t.type==='buy'&&yr(t.date)).map(t=>t.amount)),real=realizedYear(y);
  const cm=D.cats.map(c=>({c:c,v:sumArr(ks.map(k=>spentCat(k,c.id)))})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v),mx=Math.max.apply(null,cm.map(x=>x.v).concat([1]));
  return'<div class="card"><h3>Resumen de '+y+'</h3><div class="kpis" style="margin-top:8px"><div class="kpi"><small>Ingresos</small><b>'+money(inc)+'</b></div><div class="kpi"><small>Gastos</small><b>'+money(sp)+'</b></div><div class="kpi"><small>Ahorro</small><b class="'+(sv<0?'neg':'')+'">'+money(sv)+'</b></div><div class="kpi"><small>Meses con datos</small><b>'+ks.length+'</b></div></div></div>'+
   '<div class="card"><h3>💶 Rendimientos del año</h3><div class="leg"><span>Intereses registrados</span><b>'+money(intr)+'</b></div><div class="leg"><span>Dividendos cobrados</span><b>'+money(div)+'</b></div><div class="leg"><span>Aportado a inversión</span><b>'+money(buys)+'</b></div><div class="leg"><span>Ganancia realizada por ventas</span><b>'+money(real)+'</b></div><p class="tiny" style="margin:8px 0 0">Datos informativos a partir de lo que has registrado en MyFin; no sustituyen a los documentos de tus bancos ni constituyen asesoramiento fiscal.</p></div>'+
   '<div class="card"><h3>Gasto del año por categoría</h3>'+cm.map(x=>'<div class="pv"><div class="l"><span>'+x.c.emoji+' '+esc(x.c.name)+'</span><span>'+money(x.v)+'</span></div><div class="b"><i style="width:'+(x.v/mx*100).toFixed(1)+'%;background:'+catColor(x.c.id)+'"></i></div></div>').join('')+'</div>'
}

/* ---- Avisos al abrir y registro del service worker ---- */
function notifyOpen(){
  if(!D||!D.ui||!D.ui.notif||S.screen!=='app'||!('Notification' in window)||Notification.permission!=='granted')return;
  const day=todayISO();if(D.settings.lastNotifDay===day)return;const msgs=[];
  const pf=D.flows.filter(f=>!f.auto&&dueCount(f)>0);if(pf.length)msgs.push(pf.length+' operaciones mensuales por aplicar');
  D.accounts.forEach(a=>{if(pendingInterest(a))msgs.push('intereses por registrar en '+a.name);if(a.maturity&&matDays(a)<=7&&matDays(a)>=0)msgs.push(a.name+' vence pronto')});

function cSim(o){
  const rm=o.rate/100/12;let bal=o.init,inv=o.init,c=o.contrib;const rows=[],months=Math.round(o.years*12);
  for(let m=1;m<=months;m++){bal*=1+rm;if(m%o.per===0){bal+=c;inv+=c}
    if(m%12===0||m===months){rows.push({y:m/12,inv:inv,bal:bal});if(m%12===0)c*=1+o.growth/100}}

function rateOn(a,d){
  if(a.promoEnd&&d>a.promoEnd)return +a.taeAfter||0;
  const R=a.rates||[],h=R.filter(x=>x.d<=d);return h.length?(+h[h.length-1].tae||0):(R.length?(+R[0].tae||0):(+a.tae||0))
}
const dayRate=(a,d)=>{const r=rateOn(a,d)/100;return a.rateType==='tin'?r/365:Math.pow(1+r,1/365)-1};
function accrued(a,from,to){
  if(!(to>from))return 0;const ck=a.id+'|'+from+'|'+to;if(IC[ck]!==undefined)return IC[ck];
  const dl=accDeltas(a.id).filter(x=>x.d>from).sort((x,y)=>x.d.localeCompare(y.d));
  let bal=a.balance-dl.reduce((s,x)=>s+x.v,0),tot=0,i=0;const d=dparse(from),end=dparse(to);
  for(d.setDate(d.getDate()+1);d<=end;d.setDate(d.getDate()+1)){
    const ds=iso(d);while(i<dl.length&&dl[i].d<=ds){bal+=dl[i].v;i++}
    const b=Math.max(0,a.cap>0?Math.min(bal,a.cap):bal);tot+=b*dayRate(a,ds)}

}

function project(N,expM,opts){opts=opts||{};
  const accs=D.accounts.map(a=>({a:a,bal:a.balance,acr:0,int:0,ser:[a.balance],zero:null,contrib:0})),by={};accs.forEach(x=>by[x.a.id]=x);
  const mv=(f,t,v)=>{if(by[f]){by[f].bal-=v;by[f].contrib-=v}if(by[t]){by[t].bal+=v;by[t].contrib+=v}};
  const gl=D.goals.filter(g=>g.monthly>0&&(g.fromAcc||g.toAcc)&&!goalFlow(g)).map(g=>({g:g,rem:goalInfo(g).rem}));
  for(let m=1;m<=N;m++){
    const ds=shiftKey(curKey(),m)+'-15';
    D.flows.forEach(f=>mv(f.from,f.to,f.amount));
    gl.forEach(x=>{const v=Math.min(x.g.monthly,x.rem);if(v>0){mv(x.g.fromAcc,x.g.toAcc,v);x.rem-=v}});
    if(opts.extra&&by[opts.extra.acc]){by[opts.extra.acc].bal+=opts.extra.amt;by[opts.extra.acc].contrib+=opts.extra.amt}
    const sp=by[budAcc()];if(expM>0&&sp){sp.bal-=expM;sp.contrib-=expM}
    accs.forEach(x=>{const a=x.a,est=isEst(a);
      if(paysInt(a)||est){
        const pm=est?1:periodMonths(a),n=12/pm,t=Math.max(0,rateOn(a,ds)+(opts.dtae||0))/100,rm=(a.rateType==='tin'&&!est)?t/12:n*(Math.pow(1+t,1/n)-1)/12;
        if(t>0&&x.bal>0)x.acr+=((a.cap>0&&!est)?Math.min(x.bal,a.cap):x.bal)*rm;
        if(m%pm===0){const c=x.acr*(paysInt(a)?taxF():1);x.bal+=c;x.int+=c;x.acr=0}
      }
      if(x.zero===null&&x.bal<0)x.zero=m;
      x.ser.push(r2(x.bal))});
  }
  return accs
}

async function pbk(pass,salt){
  const en=new TextEncoder(),k=await crypto.subtle.importKey('raw',en.encode(pass),'PBKDF2',false,['deriveBits']);
  const b=await crypto.subtle.deriveBits({name:'PBKDF2',salt:en.encode(salt),iterations:150000,hash:'SHA-256'},k,256);
  return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('')
}

    if(t.name)p.name=t.name;if(t.isin)p.isin=t.isin});

    p.units=Math.abs(p.units)<1e-9?0:p.units;p.cost=r2(p.cost);p.real=r2(p.real);p.div=r2(p.div);
    p.cur=(px&&px.cur)||'EUR';p.priceN=px?px.p:null;p.nofx=!!(px&&!fx);p.price=(px&&fx)?px.p/fx:null;p.pdate=px?px.d:null;
    p.value=(p.price!=null&&p.units>0)?r2(p.units*p.price):null;
    p.pl=p.value!=null?r2(p.value-p.cost):null;p.plPct=(p.value!=null&&p.cost>0)?p.pl/p.cost*100:null;return p})
    .filter(p=>p.units>0||p.div||p.real).sort((a,b)=>((b.value!=null?b.value:b.cost)-(a.value!=null?a.value:a.cost)))
}
function xirr(P,tx){
  const fl=[];(tx||D.inv.tx).forEach(t=>{const d=dparse(t.date);if(t.type==='buy')fl.push([d,-(t.amount+(t.fee||0))]);else if(t.type==='sell')fl.push([d,t.amount-(t.fee||0)]);else if(t.type==='div')fl.push([d,t.amount])});
  const cur=P.reduce((s,p)=>s+(p.units>0?(p.value!=null?p.value:p.cost):0),0);if(cur>0)fl.push([dparse(todayISO()),cur]);
  if(fl.length<2)return null;fl.sort((a,b)=>a[0]-b[0]);const t0=fl[0][0];
  if((fl[fl.length-1][0]-t0)/86400000<60)return null;
  if(!fl.some(x=>x[1]<0)||!fl.some(x=>x[1]>0))return null;
  const f=r=>fl.reduce((s,x)=>s+x[1]/Math.pow(1+r,(x[0]-t0)/31557600000),0);
  let lo=-0.99,hi=10,flo=f(lo);if(flo*f(hi)>0)return null;
  for(let i=0;i<200;i++){const mid=(lo+hi)/2,fm=f(mid);if(Math.abs(fm)<1e-7)return mid;if(flo*fm<0)hi=mid;else{lo=mid;flo=fm}}
  return(lo+hi)/2
}

  return{pf:pf||'all',tx:tx,pos:P,cost:r2(cost),value:r2(value),pl:r2(value-cost),div:r2(div),real:r2(real),unk:unk,nofx:nofx,short:short,xirr:xirr(P,tx)}
}

function invApply(t,cash){
  const pf=D.inv.pfs.find(p=>p.id===t.pf),a=pf&&pf.acc&&accById(pf.acc);if(!a)return;
  const cost=t.type==='buy'?t.amount+(t.fee||0):t.type==='sell'?-(t.amount-(t.fee||0)):0;let sd=cost,bd=0;
  if(t.type==='div'){sd=0;bd=cash?t.amount:0}else bd=cash?0:cost;
  if(a.sec===undefined)a.sec=a.balance;a.sec=r2(a.sec+sd);
  if(bd){a.balance=r2(a.balance+bd);logTx(a.id,bd,t.type==='div'?'dividend':'invest',({buy:'Compra',sell:'Venta',div:'Dividendo'}[t.type])+' '+t.name+(cash?'':' (dinero de fuera de MyFin)'),t.date)}
  t.la=a.id;t.sd=r2(sd);t.bd=r2(bd)
}
function invRevert(t){
  const a=t.la&&accById(t.la);if(!a)return;
  if(pfOfAcc(a.id)&&a.sec!==undefined)a.sec=r2(a.sec-(t.sd||0));

function syncInvAcc(){
  if(!D||!D.inv||!D.inv.pfs)return;let ch=false;const day=todayISO();
  D.inv.pfs.forEach(pf=>{const a=pf.acc&&accById(pf.acc);if(!a)return;
    const v=portfolio(pf.id).value,sec=a.sec===undefined?a.balance:a.sec,d=r2(v-sec);

      a.balance=r2(a.balance-sec+v);a.sec=v;ch=true}});

}

const BANKPFX=/^(compra( con)? (tarj(eta)?\.?|tarj\.?)( (cr[eé]dito|d[eé]bito|cred\.?|deb\.?))?( en)?|pago( con)? (tarjeta|m[oó]vil)( en)?|pago en|compra en|compra|adeudo( (recibo|sepa|directo))?( de)?|recibo( de)?|cargo( por)?( recibo)?|transacci[oó]n( contactless)?|contactless|card purchase|card payment|apple pay|google pay|tpv|domiciliaci[oó]n( de)?|operaci[oó]n( con)? tarjeta)\b[\s:.\-]*/i;
function cleanDesc(s){

  do{prev=t;t=t.replace(BANKPFX,'').replace(/^(\d{4}[x*]{4,}\d{0,8}|[x*]{4,}\d{2,4}|\*\d{4}|\d{12,})(?![a-z\d])/i,'').replace(/^\d{1,2}[\/.\-]\d{1,2}([\/.\-]\d{2,4})?\s*/,'').replace(/^[\s:.\-·]+/,'').trim()}while(t!==prev&&t);
  t=t.replace(/\b\d{4}[x*]{4,}\d{0,8}\b|\b[x*]{4,}\d{2,4}\b|\b\d{12,}\b/gi,'').replace(/\s+/g,' ').trim();
  return t||orig
}

   pos.map(p=>'<tr style="border-top:1px solid var(--line)"><td style="padding:6px 0;overflow-wrap:anywhere;vertical-align:top">'+esc(p.name.slice(0,40))+'<div class="tiny">'+fmtU(p.units)+' uds · medio '+money(p.cost/p.units)+'</div></td><td '+td+'>'+money(p.cost)+'</td><td '+td+'>'+money(val(p))+(p.value==null?'*':'')+'</td><td '+td+' class="'+(p.pl!=null&&p.pl<0?'neg':'pos')+'">'+gan(p.pl,p.plPct)+'</td><td '+td+'>'+(tot>0?(val(p)/tot*100).toFixed(1)+'%':'—')+'</td></tr>').join('')+
   '<tr style="border-top:2px solid var(--line);font-weight:700"><td style="padding:6px 0">Total</td><td '+td+'>'+money(P.cost)+'</td><td '+td+'>'+money(P.value)+'</td><td '+td+' class="'+(P.pl<0?'neg':'pos')+'">'+gan(P.pl,P.cost>0?P.pl/P.cost*100:null)+'</td><td '+td+'>100%</td></tr></table></div>'+
   '<p class="tiny" style="margin:6px 0 0">«Medio» es lo que pagaste de media por cada participación, comisiones incluidas.'+(pos.some(p=>p.value==null)?' * Sin precio: se cuenta a coste.':'')+'</p></div>'
}
A.invEvo=async function(){
  const api=mkApi();if(!api){toast('Hace falta el servidor de datos de mercado');return}
  const pf=curPf(),P=portfolio(pf),tx=P.tx.filter(t=>t.type==='buy'||t.type==='sell').sort((a,b)=>a.date.localeCompare(b.date));if(!tx.length)return;
  const keys=[...new Set(tx.map(t=>t.key))],first=dparse(tx[0].date),days=(Date.now()-first)/864e5,rg=days<=25?'1mo':days<=360?'1y':days<=1800?'5y':'max';
  S.inv.busy='Descargando el historial de precios…';render();
  const ser={},miss=[];
  for(const k of keys){const sym=D.inv.tk[k];if(!sym){miss.push(k);continue}
    try{const c=await jget(api+'/chart?symbol='+encodeURIComponent(sym)+'&range='+rg),fx=fxRate(c.currency||'EUR')||1;ser[k]=(c.points||[]).map(q=>[q[0]*1000,q[1]/fx])}catch(e){miss.push(k)}}
  const pts=[],now=new Date();let d=new Date(first.getFullYear(),first.getMonth()+1,0);
  for(let guard=0;guard<600;guard++){
    const end=d>now?now:d,T=end.getTime()+86399e3,u={},cost={};let inv=0,val=0;
    tx.forEach(t=>{if(dparse(t.date).getTime()>T)return;const s=t.type==='buy'?1:-1,c=t.type==='buy'?t.amount+(t.fee||0):-t.amount;u[t.key]=(u[t.key]||0)+s*t.units;inv+=c;cost[t.key]=(cost[t.key]||0)+c});
    Object.keys(u).forEach(k=>{if(u[k]<=1e-9)return;const L=ser[k];let px=null;if(L)for(const q of L){if(q[0]<=T)px=q[1];else break}val+=px!=null?u[k]*px:Math.max(0,cost[k]||0)});
    pts.push({t:end.getTime(),inv:r2(inv),val:r2(val)});if(d>=now)break;d=new Date(d.getFullYear(),d.getMonth()+2,0)}
  if(pts.length)pts[pts.length-1].val=P.value;
  S.inv.evo={pf:pf,pts:pts,miss:miss.length,at:Date.now()};S.inv.busy='';render()
};
function svgEvo(pts){
  if(pts.length<2)return'<p class="tiny">Hace falta más de un mes de historial para dibujar la evolución.</p>';
  const W=320,H=170,L=40,R=8,T=10,B=22,t0=pts[0].t,t1=pts[pts.length-1].t,ymax=(Math.max.apply(null,pts.map(p=>Math.max(p.inv,p.val)))||1)*1.1;
  const x=t=>L+(W-L-R)*(t-t0)/Math.max(1,t1-t0),y=v=>T+(H-T-B)*(1-Math.max(0,v)/ymax);
  const line=k=>pts.map((p,i)=>(i?'L':'M')+x(p.t).toFixed(1)+' '+y(p[k]).toFixed(1)).join(' ');
  const last=pts[pts.length-1],col=last.val>=last.inv?'var(--ok)':'var(--bad)',mk=t=>{const z=new Date(t);return mShort(z.getFullYear()+'-'+pad(z.getMonth()+1))+' '+String(z.getFullYear()).slice(2)};
  let g='';[0,0.5,1].forEach(f=>{const v=ymax/1.1*f;g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v).toFixed(1)+'" y2="'+y(v).toFixed(1)+'" stroke="var(--line)"></line><text x="'+(L-4)+'" y="'+(y(v)+3).toFixed(1)+'" text-anchor="end" font-size="8" fill="var(--mut)">'+Math.round(v)+'</text>'});
  g+='<text x="'+L+'" y="'+(H-6)+'" font-size="8" fill="var(--mut)">'+mk(t0)+'</text><text x="'+(W-R)+'" y="'+(H-6)+'" text-anchor="end" font-size="8" fill="var(--mut)">'+mk(t1)+'</text>';
  return'<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto">'+g+'<path d="'+line('inv')+'" fill="none" stroke="var(--pri)" stroke-width="2" stroke-dasharray="4 3"></path><path d="'+line('val')+'" fill="none" stroke="'+col+'" stroke-width="2.5" stroke-linejoin="round"></path><circle cx="'+x(last.t).toFixed(1)+'" cy="'+y(last.val).toFixed(1)+'" r="4" fill="'+col+'"></circle></svg>'+
   '<div class="tiny" style="display:flex;gap:12px;flex-wrap:wrap"><span><b style="color:var(--pri)">┅</b> Aportado acumulado</span><span><b style="color:'+col+'">━</b> Valor de la cartera</span></div>'
}
function evoCard(P){
  const E=S.inv.evo&&S.inv.evo.pf===P.pf?S.inv.evo:null;
  if(E)return'<div class="card"><div class="row"><h3>📈 Evolución</h3><button class="btn ghost sm" onclick="A.invEvo()">🔄</button></div>'+svgEvo(E.pts)+
    '<p class="tiny" style="margin:6px 0 0">Valor a final de cada mes con el precio de cierre de ese día'+(E.miss?'. '+E.miss+' posición'+(E.miss>1?'es':'')+' sin ticker o sin historial se cuenta'+(E.miss>1?'n':'')+' a coste':'')+'. Las que cotizan en otra divisa usan el tipo de cambio de hoy, así que es aproximado.</p></div>';
  return'<div class="card"><h3>📈 Evolución</h3>'+svgInv(P)+(mkApi()?'<button class="btn sec" style="margin-top:8px" onclick="A.invEvo()">Ver cómo ha evolucionado el valor mes a mes</button>':'')+'</div>'
}

const CL_RECOV=/type=recovery/.test(location.hash);
A.cloudForgot=async function(){
  const email=String((D?S.cl.email:S.auth.email)||'').trim().toLowerCase();
  if(!/^\S+@\S+\.\S+$/.test(email)){toast('Escribe primero tu email');return}
  try{const sb=await sbLoad(),r=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});if(r.error)throw r.error;
    const m='Si hay una cuenta con ese correo, te llegará un mensaje para poner una contraseña nueva. Ábrelo en este mismo dispositivo.';if(D)CL.err=m;else S.auth.err=m}
  catch(e){const m=cloudMsg(e);if(D)CL.err=m;else S.auth.err=m}render()
};
A.cloudNewPass=async function(){
  const p=String((S.modal&&S.modal.f&&S.modal.f.p)||'');if(p.length<6){toast('Mínimo 6 caracteres');return}
  try{const r=await CL.sb.auth.updateUser({password:p});if(r.error)throw r.error;S.modal=null;toast('Contraseña cambiada');render()}catch(e){toast(cloudMsg(e))}
};
const _vModal13=vModal;
vModal=function(){const M=S.modal;if(M&&M.type==='newpass')return'<div class="modal"><div><h3>🔑 Nueva contraseña</h3><p class="tiny">Escribe la contraseña que usarás para entrar en tu cuenta de la nube.</p><input type="password" autocomplete="new-password" placeholder="Mínimo 6 caracteres" oninput="S.modal.f.p=this.value"><button class="btn" onclick="A.cloudNewPass()">Guardar contraseña</button><button class="btn ghost" onclick="S.modal=null;render()">Ahora no</button></div></div>';return _vModal13()};
const _cloudCard13=cloudCard;
cloudCard=function(){return _cloudCard13()};   // versión Play Store: sin contraseñas de la nube (solo Google)
// Versión Play Store: pantalla de entrada con Google (nube) o perfil solo en el dispositivo. Sin registro por email.
vAuth=function(){
  const n=S.auth.mode==='new';
  let h=vAuthOld().replace(/<button class="btn" onclick="A\.submitAuth\(\)">Continuar<\/button><button class="btn sec" onclick="A\.googleLogin\(\)">Continuar con Google<\/button>/,
    '<button class="btn sec" onclick="A.submitAuth()">'+(n?'Crear perfil en este dispositivo':'Entrar en mi perfil de este dispositivo')+'</button>');
  const i=h.indexOf('</h2>')+5;
  return h.slice(0,i)+'<div class="card"><h3>☁️ Con tu cuenta de Google</h3><p class="tiny" style="margin:2px 0 6px">Tus datos se guardan en tu cuenta y los tienes en el móvil y en el ordenador. Solo tú puedes verlos.</p><button class="btn" onclick="A.cloudGoogle()">Continuar con Google</button></div>'+
    '<p style="margin:14px 0 0"><b>O sin cuenta, solo en este dispositivo:</b></p>'+h.slice(i)
};
